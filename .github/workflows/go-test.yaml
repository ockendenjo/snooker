name: Go tests

on:
  workflow_call: { }

permissions:
  contents: read

jobs:
  test:
    name: Test
    timeout-minutes: 3
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: 'amazon/dynamodb-local:3.3.0@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4'
        ports:
          - 8000:8000
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
          key: "go-testing-${{ hashFiles('go.mod', 'cmd/**/*.go', 'pkg/**/*.go') }}"
          restore-keys: |
            go-testing-

      - name: Install tparse
        run: go install github.com/mfridman/tparse@ba2512e7be150bfcbd6f6220d517d3741f8f2f75 # v0.18.0

      - name: Run tests
        env:
          RUN_DYNAMODB_LOCAL_TESTS: '1'
        run: go test $(go list ./... | grep -v /e2e) -json | tparse
